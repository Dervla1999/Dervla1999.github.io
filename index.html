<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dervla Photography</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: white;
      text-align: center;
    }
    header {
      padding: 20px;
      background-color: #000;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
      gap: 10px;
    }
    .gallery img {
      width: 300px;
      height: 200px;
      object-fit: cover;
      border-radius: 5px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .gallery img:hover {
      transform: scale(1.03);
    }
    footer {
      margin-top: 20px;
      padding: 10px;
      background-color: #000;
      color: #888;
    }
    /* Lightbox styles */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 4px;
    }
    .prev, .next {
  cursor: pointer;
  position: absolute;
  top: 50%;
  font-size: 50px;
  color: #fff;
  padding: 20px;
  user-select: none;
}
.prev {
  left: 20px;
}
.next {
  right: 20px;
}
.prev:hover, .next:hover {
  color: #aaa;
}

  </style>
</head>
<body>
  <header>
    <h1>Dervla Foley</h1>
    <p>Photography Portfolio</p>
  </header>

  <section class="gallery">
    <img src="000083380022.jpg" alt="updatelater1">
    <img src="000083370007.jpg" alt="updatelater2">
    <img src="000083370009.jpg" alt="updatelater3">
    <img src="000076670034.jpg" alt="updatelater4">
    <img src="000076670021.jpg" alt="updatelater5">
  </section>

<div class="lightbox" id="lightbox">
  <span class="prev" id="prev">&#10094;</span>
  <img id="lightbox-img" src="" alt="Expanded photo">
  <span class="next" id="next">&#10095;</span>
</div>


  <footer>© 2026 Dervla Foley</footer>

  <script>
  const images = Array.from(document.querySelectorAll('.gallery img'));
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  let currentIndex = 0;

  // Open lightbox
  images.forEach((img, index) => {
    img.addEventListener('click', () => {
      currentIndex = index;
      showImage();
      lightbox.style.display = 'flex';
    });
  });

  // Close when clicking outside image
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) {
      lightbox.style.display = 'none';
    }
  });

  // Show current image
  function showImage() {
    lightboxImg.src = images[currentIndex].src;
  }

  // Next / Previous buttons
  nextBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    currentIndex = (currentIndex + 1) % images.length;
    showImage();
  });

  prevBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    showImage();
  });

  // Allow keyboard arrows
  document.addEventListener('keydown', (e) => {
    if (lightbox.style.display === 'flex') {
      if (e.key === 'ArrowRight') {
        currentIndex = (currentIndex + 1) % images.length;
        showImage();
      }
      if (e.key === 'ArrowLeft') {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        showImage();
      }
      if (e.key === 'Escape') {
        lightbox.style.display = 'none';
      }
    }
  });
</script>

</body>
</html>

</body>
</html>
