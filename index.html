<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dervla Photography</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: white;
      text-align: center;
    }
    header {
      padding: 20px;
      background-color: #000;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
      gap: 10px;
    }
    .gallery img {
      width: 300px;
      height: 200px;
      object-fit: cover;
      border-radius: 5px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .gallery img:hover {
      transform: scale(1.03);
    }
    footer {
      margin-top: 20px;
      padding: 10px;
      background-color: #000;
      color: #888;
    }
    /* Lightbox styles */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Dervla Foley</h1>
    <p>Photography Portfolio</p>
  </header>

  <section class="gallery">
    <img src="000083380022.jpg" alt="updatelater1">
    <img src="000083370007.jpg" alt="updatelater2">
    <img src="000083370009.jpg" alt="updatelater3">
    <img src="000076670034.jpg" alt="updatelater4">
    <img src="000076670021.jpg" alt="updatelater5">
  </section>

  <div class="lightbox" id="lightbox">
    <img src="" alt="Expanded photo">
  </div>

  <footer>© 2026 Dervla Foley</footer>

  <script>
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = lightbox.querySelector("img");
    const galleryImages = document.querySelectorAll(".gallery img");

    galleryImages.forEach(img => {
      img.addEventListener("click", () => {
        lightboxImg.src = img.src;
        lightbox.style.display = "flex";
      });
    });

    lightbox.addEventListener("click", e => {
      if (e.target !== lightboxImg) {
        lightbox.style.display = "none";
      }
    });
  </script>
</body>
</html>

</body>
</html>
